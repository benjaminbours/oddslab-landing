name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # PostHog project API key is a publishable client key (it ships in the
          # JS bundle), so it lives here rather than in secrets. NEXT_PUBLIC vars
          # are inlined at build time — CI must set them for analytics to light up.
          # Swap to ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }} if you'd rather manage it
          # as a repo variable.
          NEXT_PUBLIC_POSTHOG_KEY: phc_yEJvshMkRnuYu89WW5MPwpqcuVDkRCQJUQYP4Wg8wCQN
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
